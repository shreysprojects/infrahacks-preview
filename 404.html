<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>Lost in the city: InfraHacks</title>
<link rel="icon" href="/infrahacks-preview/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@700;900&family=Outfit:wght@300;400;600&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
<style>
  :root{--mag:#E06BF5;--violet:#A78BFA}
  *{margin:0;padding:0;box-sizing:border-box}
  body{min-height:100vh;display:flex;align-items:center;justify-content:center;text-align:center;padding:28px;
    background:radial-gradient(120% 90% at 50% -10%,#2A1644,#0c0620 70%);color:#F5F1FD;font-family:'Outfit',system-ui,sans-serif}
  .n{font-family:'Unbounded';font-weight:900;font-size:clamp(72px,18vw,140px);line-height:1;
    background:linear-gradient(95deg,var(--violet),var(--mag));-webkit-background-clip:text;background-clip:text;color:transparent}
  h1{font-family:'Unbounded';font-weight:700;font-size:clamp(22px,4vw,30px);margin:8px 0 12px}
  p{color:rgba(245,241,253,.7);font-size:17px;max-width:420px;margin:0 auto 28px;line-height:1.6}
  a.btn{display:inline-block;background:linear-gradient(95deg,#B07CFA,#E06BF5);color:#1A0A30;text-decoration:none;
    font-weight:600;padding:13px 28px;border-radius:999px}
  .cue{margin-top:22px;font-family:'JetBrains Mono';font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:rgba(245,241,253,.4)}
</style>
</head>
<body>
  <div>
    <div class="n">404</div>
    <h1>This block isn't on the map.</h1>
    <p>The page you're looking for doesn't exist: maybe it got demolished, maybe it was never built. Let's get you back downtown.</p>
    <a class="btn" href="/infrahacks-preview/">Back to infrahacks.org</a>
    <div class="cue">☀ → ☾</div>
  </div>
</body>
</html>
